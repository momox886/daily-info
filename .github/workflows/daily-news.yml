name: daily-news

on:
  schedule:
    # Tous les jours à 04:00 UTC (= 06:00 heure de Paris en été,
    # 05:00 en été). Le cron GitHub est toujours en UTC.
    # Avancé de 2h par rapport à 06:00 UTC pour compenser les retards
    # connus de GitHub Actions sur le tier gratuit (parfois > 2h).
    - cron: "0 4 * * *"
  workflow_dispatch: # permet un lancement manuel depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour le commit-back de l'état anti-doublon

jobs:
  daily-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Exécution du bot (one-shot)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run daily

      # L'état anti-doublon (sent-articles.json) et la santé des sources
      # (source-health.json) sont committés dans le repo : contrairement au
      # cache GitHub (expiré au bout de 7 jours), ils persistent indéfiniment
      # et évitent les doublons d'une exécution à l'autre.
      # Toujours exécuté (même si l'envoi Discord a échoué) pour ne pas perdre
      # l'état. N'engendre pas de boucle : ce workflow n'écoute pas l'événement push.
      - name: Commit de l'état anti-doublon
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sent-articles.json source-health.json
          git diff --cached --quiet || git commit -m "chore: mise à jour de l'état anti-doublon"
          git push origin main
